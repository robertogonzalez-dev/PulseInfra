name: Terraform CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write        # OIDC to AWS for `plan`
  pull-requests: write   # plan comment
  security-events: write # upload scan results

jobs:
  static:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        root: [terraform/bootstrap, terraform/envs/dev]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
        working-directory: terraform
      - run: terraform init -backend=false -input=false
        working-directory: ${{ matrix.root }}
      - run: terraform validate
        working-directory: ${{ matrix.root }}
      - uses: terraform-linters/setup-tflint@v4
      - run: tflint --init --config "$GITHUB_WORKSPACE/.tflint.hcl" && tflint --recursive --config "$GITHUB_WORKSPACE/.tflint.hcl"
        working-directory: terraform
        env:
          GITHUB_TOKEN: ${{ github.token }} # avoids rate limits when downloading the AWS ruleset

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy IaC misconfiguration scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: terraform
          format: sarif
          output: trivy.sarif
          exit-code: "0" # findings appear in the Security tab; see docs/SCOPE.md "hardening"
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif

  plan:
    # Runs only once AWS is wired up (repo variable AWS_ROLE_ARN from the bootstrap output).
    if: github.event_name == 'pull_request' && vars.AWS_ROLE_ARN != ''
    needs: static
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/envs/dev
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - uses: hashicorp/setup-terraform@v3
      - run: terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="region=${{ vars.AWS_REGION || 'us-east-1' }}"
      - id: plan
        run: terraform plan -input=false -no-color -var "image_tag=${{ vars.CURRENT_IMAGE_TAG || 'latest' }}" | tee plan.txt
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('terraform/envs/dev/plan.txt', 'utf8').slice(-60000);
            await github.rest.issues.createComment({
              ...context.repo, issue_number: context.issue.number,
              body: "### Terraform plan (dev)\n```\n" + plan + "\n```",
            });
